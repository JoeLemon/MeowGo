name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check rpa start-app.py build.py tests

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        # slow 用例会驱动真实鼠标键盘，只在本地手动跑
        run: python -m pytest -m "not slow" --cov=rpa --cov-report=term-missing --cov-fail-under=70

  macos:
    # macOS 上不跑 Tk / 系统托盘用例（GitHub runner 没有交互式桌面），
    # 但静态检查与纯逻辑（engine / 日志 / i18n / 平台能力表）必须通过。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check rpa start-app.py build.py tests

      # mypy 的 ctypes 类型桩来自 Windows，macOS 上会让 windll / WINFUNCTYPE
      # 误报，因此不做静态类型检查。
      - name: Engine tests (pytest)
        run: python -m pytest -m "not slow and not gui"

      # macOS 单独跑一次主窗口冒烟（完整 GUI 套件只适合 Windows）
      - name: GUI smoke (macOS)
        run: python -m pytest tests/test_gui_mac_smoke.py -q
