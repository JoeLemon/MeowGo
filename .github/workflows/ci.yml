name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check rpa start-app.py build.py

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests (pytest)
        # slow 用例会驱动真实鼠标键盘，只在本地手动跑
        run: python -m pytest -m "not slow" --cov=rpa --cov-report=term-missing --cov-fail-under=65
